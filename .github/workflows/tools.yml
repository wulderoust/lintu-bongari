name: tools

on:
  push:
    paths: ["tools/**", "docs/formats.md", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**", "docs/formats.md", ".github/workflows/tools.yml"]

jobs:
  lb-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./tools/lb-verify[test]
      - run: pytest -q tools/lb-verify/tests
